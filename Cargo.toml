[workspace]
members = ["crates/somachron"]
default-members = ["crates/somachron"]
resolver = "3"

[workspace.dependencies]
somachron-desktop = { path = "crates/somachron" }

gpui = { version = "0.2.2" }
gpui-component = { version = "0.5" }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
futures = "0.3.31"

dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# smallvec is included here for convenience, it is used by gpui when creating
# components that can have children. uncomment this line or
# use `cargo add smallvec` to add it to your project
# smallvec = "1.13.2"

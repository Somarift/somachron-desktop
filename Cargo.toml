[workspace]
members = ["crates/somachron-desktop"]
default-members = ["crates/somachron-desktop"]
resolver = "3"

[workspace.dependencies]
somachron-desktop = { path = "crates/somachron-desktop" }

gpui = { version = "0.2.2" }
gpui-component = { version = "0.5" }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
serde = "1"
serde_json = "1"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.31"
bytes = "1.10.1"
regex = "1"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# [target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"

# [workspace.dependencies.windows]
windows = "0.62"

# smallvec is included here for convenience, it is used by gpui when creating
# components that can have children. uncomment this line or
# use `cargo add smallvec` to add it to your project
# smallvec = "1.13.2"
